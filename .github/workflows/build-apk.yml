name: Build V-Translate Live Android APK & Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests & Build Debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release File
        run: cp app/build/outputs/apk/debug/app-debug.apk VTranslate-Live-Android-v1.0.5.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTranslate-Live-Android-Debug-APK
          path: VTranslate-Live-Android-v1.0.5.apk

      - name: Publish GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: V-Translate Live Android v1.0.5
          body: |
            Bản cập nhật **V-Translate Live Android v1.0.5**:
            - Cập nhật mặc định sang các model Gemini mới nhất còn hoạt động (`gemini-3.8-flash`, `gemini-3.5-flash-lite`, `gemini-3.1-pro-preview`).
            - Chống dịch lặp nội dung cũ triệt để hơn (`TextDeduplicator` lưu lịch sử 20 câu & chặn lặp câu tĩnh) và đặt mặc định khung phụ đề nổi ở phía trên (`14%`) để không đè lên phụ đề gốc ở dưới gây lặp OCR.
            - Ẩn thông báo hủy coroutine khi bấm Dừng.
          files: VTranslate-Live-Android-v1.0.5.apk
