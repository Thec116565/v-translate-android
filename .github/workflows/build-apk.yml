name: Build V-Translate Live Android APK & Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests & Build Debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release File
        run: cp app/build/outputs/apk/debug/app-debug.apk VTranslate-Live-Android-v1.0.6.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTranslate-Live-Android-Debug-APK
          path: VTranslate-Live-Android-v1.0.6.apk

      - name: Publish GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: V-Translate Live Android v1.0.6
          body: |
            Bản nâng cấp lớn **V-Translate Live Android v1.0.6**:
            - **Thanh công cụ dọc nổi (Floating Vertical Toolbar)** khi đang xem Douyin/YouTube: Tạm dừng/Tiếp tục (`▶/⏸`), Dừng (`⏹`), Đổi model nhanh (`🤖`), Đổi chế độ OCR/Audio (`📷/🔊`), Khóa xuyên chạm (`🔒/🔓`), và Thu gọn/Kéo di chuyển (`⚡`).
            - **Chỉnh sửa vùng quét phụ đề trực tiếp trên màn hình (`🎯`)**: Kéo khung xanh di chuyển và kéo góc `↘` đổi kích thước trực tiếp ngay trên Douyin mà không cần quay lại app.
            - **Nhiều giọng đọc lựa chọn**: Quét danh sách giọng đọc có sẵn trên máy, chọn giọng và bấm **Nghe thử** ngay trong tab `🎛 Phụ Đề & Giọng`.
            - **Tối ưu hiệu năng bộ nhớ**: Cắt trực tiếp vùng dải dòng ảnh OCR từ `ImageReader` (giảm ~80% cấp phát RAM mỗi khung hình) & cache cấu hình trong bộ nhớ.
          files: VTranslate-Live-Android-v1.0.6.apk
