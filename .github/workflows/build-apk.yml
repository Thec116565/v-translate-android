name: Build V-Translate Live Android APK & Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests & Build Debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release File
        run: cp app/build/outputs/apk/debug/app-debug.apk VTranslate-Live-Android-v1.0.4.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTranslate-Live-Android-Debug-APK
          path: VTranslate-Live-Android-v1.0.4.apk

      - name: Publish GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: V-Translate Live Android v1.0.4
          body: |
            Bản cập nhật **V-Translate Live Android v1.0.4**:
            - Sửa triệt để lỗi crash Android 14+ khi bấm Bắt đầu dịch màn hình (bổ sung `MediaProjection.registerCallback` trước khi tạo `VirtualDisplay` + bọc an toàn Foreground Service).
            - Thêm nút **"🔄 Lấy & Xác nhận DS Model còn hoạt động"** trong tab `🔑 API Pool` để kiểm tra và tự động cập nhật các model Gemini còn sống trực tiếp từ Google AI Studio.
          files: VTranslate-Live-Android-v1.0.4.apk
