name: Build V-Translate Live Android APK & Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests & Build Debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release File
        run: cp app/build/outputs/apk/debug/app-debug.apk VTranslate-Live-Android-v1.0.3.apk

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTranslate-Live-Android-Debug-APK
          path: VTranslate-Live-Android-v1.0.3.apk

      - name: Publish GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: V-Translate Live Android v1.0.3
          body: |
            Bản cập nhật **V-Translate Live Android v1.0.3**:
            - Bổ sung ảnh nền Dark-Mode hiện đại (`app_bg.jpg`) với lớp phủ trong suốt dễ đọc chữ.
            - Dùng chung chứng chỉ ký cố định, cài đè trực tiếp lên bản `v1.0.2` không mất API Key.
          files: VTranslate-Live-Android-v1.0.3.apk
